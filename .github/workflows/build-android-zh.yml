name: Build Android APK (ZH)

on:
  push:
    branches: [ android-zh-localization ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android-zh-localization

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install

      - name: Build Android APK
        run: |
          set -e
          cd apps/android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          tail -100 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-android-zh
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
